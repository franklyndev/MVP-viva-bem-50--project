spring:
  application:
    name: vivabem50-api
  # Lê o .env da raiz do repositório quando a API roda a partir de backend/.
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/vivabem50}
    username: ${DB_USERNAME:vivabem}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # O schema é controlado só pelo Flyway; o Hibernate apenas confere se as entidades batem com ele.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${API_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  # Fuso usado para "hoje", idade e horários da agenda. Sergipe fica em UTC-3, sem horário de verão.
  timezone: ${APP_TIMEZONE:America/Maceio}
  cors:
    # Em desenvolvimento, libera qualquer porta local (web no Vite e Flutter web).
    # Em produção, troque pelo endereço real do site, por exemplo https://vivabem50.com.br
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  jwt:
    # Obrigatório, com pelo menos 32 caracteres. Sem ele, a API não sobe.
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:PT12H}
  demo:
    # Cria a usuária de demonstração ao iniciar. Use só em desenvolvimento e na apresentação.
    enabled: ${DEMO_DATA_ENABLED:false}
    email: ${DEMO_USER_EMAIL:maria@vivabem50.com}
    password: ${DEMO_USER_PASSWORD:vivabem50}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
