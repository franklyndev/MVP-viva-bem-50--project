spring:
  application:
    name: vivabem50-api
  # Lê o .env da raiz do repositório quando a API roda a partir de backend/.
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/vivabem50}
    username: ${DB_USERNAME:vivabem}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # O schema é controlado só pelo Flyway; o Hibernate apenas confere se as entidades batem com ele.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${API_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-use-at-least-32-chars}
    ttl: 7d
  timezone: America/Fortaleza
  demo:
    enabled: ${DEMO_DATA_ENABLED:false}
    email: ${DEMO_USER_EMAIL:maria@vivabem50.com}
    password: ${DEMO_USER_PASSWORD:vivabem50}
