spring:
  application:
    name: vivabem50-api
  # Lê o .env da raiz do repositório quando a API roda a partir de backend/.
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/vivabem50}
    username: ${DB_USERNAME:vivabem}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # O schema é controlado só pelo Flyway; o Hibernate apenas confere se as entidades batem com ele.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${API_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Obrigatório, com pelo menos 32 caracteres. Sem ele, a API não sobe.
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:PT12H}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
